name: Verify portfolio

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check dependency advisories
        run: bun run audit
      - name: Lint
        run: bun run lint
      - name: Verify lint plugin compatibility
        run: bun run test:lint-rules
      - name: Verify default install-script protection
        run: bun run test:install-policy
      - name: Check types
        run: bun run typecheck
      - name: Test request protections
        run: bun run test
      - name: Build production site
        run: bun run build
      - name: Install browser
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test production pages and headers
        run: bun run test:e2e
